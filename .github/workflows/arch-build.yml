name: Build Arch Package
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  package-pkg:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fastflowlm/fastflowlm/build-environment:archlatest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)
      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          PKG_VERSION=$(echo "${VERSION}" | sed 's/^v//' | sed 's/-/./g')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Create Arch packaging metadata
        run: |
          sed -e "s|@@PKG_VERSION@@|${{ steps.get_version.outputs.pkg_version }}|g" \
              arch/PKGBUILD.in > arch/PKGBUILD
      - name: Upgrade Rust toolchain
        run: |
          pacman -Sy --noconfirm curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustc --version
      - name: Build Arch package
        working-directory: ${{ github.workspace }}/arch
        env:
          PKG_VERSION: ${{ steps.get_version.outputs.pkg_version }}
        run: |
          useradd -m builder
          chown -R builder:builder ${{ github.workspace }}
          su builder -c "makepkg -s --noconfirm --nodeps"
          mv fastflowlm-*.pkg.tar.zst \
            ${{ github.workspace }}/fastflowlm_${PKG_VERSION}_arch_x86_64.pkg.tar.zst
          ls -lah ${{ github.workspace }}/fastflowlm_${PKG_VERSION}_arch_x86_64.pkg.tar.zst
      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-archlatest-${{ steps.short_sha.outputs.sha }}-pkg
          path: ./fastflowlm_${{ steps.get_version.outputs.pkg_version }}_arch_x86_64.pkg.tar.zst
          if-no-files-found: error
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: package-pkg
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Download all pkg artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*-pkg'
      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file_glob: true
          file: packages/*/*.pkg.tar.zst
