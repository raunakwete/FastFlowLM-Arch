name: Build Arch Linux Package

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            cmake \
            ninja \
            rustup \
            curl

          rustup default stable

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          PKG_VERSION=$(echo "${VERSION}" | sed 's/^v//')

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Generate PKGBUILD
        run: |
          cat > PKGBUILD << 'EOF'
          pkgname=fastflowlm
          pkgver=${PKG_VERSION}
          pkgrel=1
          pkgdesc="FastFlowLM - Ryzen AI NPU optimized LLM runtime"
          arch=('x86_64')
          url="https://github.com/FastFlowLM/FastFlowLM"
          license=('MIT')

          depends=(
            gcc-libs
            glibc
          )

          makedepends=(
            cmake
            ninja
            git
            rust
          )

          source=(".")
          sha256sums=('SKIP')

          build() {
            cmake -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr

            cmake --build build
          }

          package() {
            DESTDIR="${pkgdir}" cmake --install build
          }
          EOF

          sed -i "s|\${PKG_VERSION}|${{ steps.get_version.outputs.pkg_version }}|g" PKGBUILD

      - name: Fix permissions
        run: |
          chown -R builder:builder .

      - name: Build Arch package
        run: |
          sudo -u builder bash -c '
            export MAKEFLAGS="-j$(nproc)"
            makepkg -sf --noconfirm
          '

      - name: List generated packages
        run: ls -lah *.pkg.tar.zst

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-archlinux-${{ steps.short_sha.outputs.sha }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: package-arch
    if: github.ref_type == 'tag'

    steps:
      - name: Download Arch package artifacts
        uses: actions/download-artifact@v4
        with:
          path: archpkgs
          pattern: 'flm-archlinux-*'

      - name: Upload Arch Packages to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file_glob: true
          file: archpkgs/*/*.pkg.tar.zst
