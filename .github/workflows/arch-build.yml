name: Build Arch Linux Package

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            rust \
            curl \
            ca-certificates

      - name: Create build user
        run: |
          useradd -m builder

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory "$(pwd)"

      - name: Get package version
        id: version
        shell: bash
        run: |
          VERSION="$(git describe --tags --always)"
          VERSION="${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get short SHA
        id: short_sha
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        shell: bash
        run: |
          mkdir -p dist

          git archive \
            --format=tar.gz \
            --prefix=fastflowlm-${{ steps.version.outputs.version }}/ \
            HEAD \
            -o dist/fastflowlm-${{ steps.version.outputs.version }}.tar.gz

          ls -lah dist/

      - name: Generate PKGBUILD
        shell: bash
        run: |
          cat > PKGBUILD <<EOF
          pkgname=fastflowlm
          pkgver=${{ steps.version.outputs.version }}
          pkgrel=1
          pkgdesc="FastFlowLM - Ryzen AI NPU optimized LLM runtime"
          arch=('x86_64')
          url="https://github.com/FastFlowLM/FastFlowLM"
          license=('MIT')

          depends=(
            gcc-libs
            glibc
          )

          makedepends=(
            cmake
            ninja
            rust
            git
          )

          source=("fastflowlm-\${pkgver}.tar.gz")
          sha256sums=('SKIP')

          build() {
            cd "\${srcdir}/fastflowlm-\${pkgver}/src"

            cmake -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DFLM_VERSION="\${pkgver}"

            cmake --build build
          }

          package() {
            cd "\${srcdir}/fastflowlm-\${pkgver}/src"

            DESTDIR="\${pkgdir}" cmake --install build
          }
          EOF

      - name: Move sources beside PKGBUILD
        run: |
          cp dist/*.tar.gz .

      - name: Fix permissions
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        shell: bash
        run: |
          runuser -u builder -- bash -lc '
            cd "$GITHUB_WORKSPACE"

            export MAKEFLAGS="-j$(nproc)"

            makepkg -sf --noconfirm
          '

      - name: Verify generated package
        run: |
          ls -lah *.pkg.tar.zst

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-archlinux-${{ steps.short_sha.outputs.sha }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    needs: package-arch

    if: github.ref_type == 'tag'

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: flm-archlinux-*

      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file_glob: true
          file: packages/**/*.pkg.tar.zst
