name: Build Packages

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            rust \
            curl \
            ca-certificates

      - name: Create build user
        run: |
          useradd -m builder

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$(pwd)"

      - name: Get version from git describe
        id: get_version
        shell: bash
        run: |
          VERSION="$(git describe --tags --long --always)"
          VERSION="${VERSION#v}"

          if [[ "$VERSION" =~ ^(.+)-([0-9]+)-g([0-9a-f]+)$ ]]; then
            PKG_VERSION="${BASH_REMATCH[1]}.r${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"
          else
            PKG_VERSION="$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --prefix=fastflowlm-${{ steps.get_version.outputs.pkg_version }}/ \
            -o fastflowlm-${{ steps.get_version.outputs.pkg_version }}.tar.gz \
            HEAD
          ls -lah fastflowlm-*.tar.gz

      - name: Generate PKGBUILD
        shell: bash
        run: |
          cat > PKGBUILD <<EOF
          pkgname=fastflowlm
          pkgver=${{ steps.get_version.outputs.pkg_version }}
          pkgrel=1
          pkgdesc="FastFlowLM - Ryzen AI NPU optimized LLM runtime"
          arch=('x86_64')
          url="https://github.com/FastFlowLM/FastFlowLM"
          license=('MIT')

          source=("fastflowlm-\${pkgver}.tar.gz")
          sha256sums=('SKIP')

          depends=(
            gcc-libs
            glibc
          )

          makedepends=(
            cmake
            ninja
            rust
          )

          build() { cd "${srcdir}/fastflowlm-${pkgver}/src" cmake -B build \ -G Ninja \ -DCMAKE_BUILD_TYPE=Release \ -DCMAKE_INSTALL_PREFIX=/usr \ -DFLM_VERSION="${pkgver}" cmake --build build }

          package() { cd "${srcdir}/fastflowlm-${pkgver}/src" DESTDIR="${pkgdir}" cmake --install build }
          EOF

      - name: Fix permissions
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        run: |
          runuser -u builder -- bash -lc '
            cd "$GITHUB_WORKSPACE"
            export MAKEFLAGS="-j$(nproc)"
            makepkg -f --noconfirm
          '

      - name: List generated packages
        run: ls -lah *.pkg.tar.zst

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-archlinux-${{ steps.short_sha.outputs.sha }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: package-arch
    if: github.ref_type == 'tag'

    steps:
      - name: Download Arch package artifact
        uses: actions/download-artifact@v4
        with:
          path: archpkgs
          pattern: flm-archlinux-*

      - name: Upload Arch package to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file_glob: true
          file: archpkgs/**/*.pkg.tar.zst
